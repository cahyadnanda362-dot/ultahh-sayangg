<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Sayang ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e0, #f8d7da, #e6d9ff);
      color: #333;
      padding: 30px 20px;
    }

    .card {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .small {
      font-size: 16px;
      color: #777;
    }

    h1 {
      margin-top: 15px;
      font-size: 30px;
    }

    .note {
      line-height: 1.7;
      font-size: 17px;
      margin-top: 20px;
    }

    button {
      margin-top: 25px;
      border: none;
      padding: 15px 28px;
      font-size: 17px;
      border-radius: 30px;
      cursor: pointer;
      background: #ff5c8a;
      color: white;
    }

    /* VIDEO AWALNYA TERSEMBUNYI */
    #video {
      display: none;
      max-width: 600px;
      margin: 30px auto 0;
      opacity: 0;
      transform: translateY(50px);
    }

    /* VIDEO MUNCUL DENGAN SLIDE KE ATAS */
    #video.show {
      display: block;
      animation: slideVideo 1s ease forwards;
    }

    @keyframes slideVideo {
      from {
        opacity: 0;
        transform: translateY(50px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    video {
      width: 100%;
      border-radius: 20px;
      display: block;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .video-text {
      text-align: center;
      margin-bottom: 15px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="small">
      a little surprise for you
    </div>

    <h1>
      HAPPY BIRTHDAY SAYANGGG 🥳❤️
    </h1>

    <p class="note">
      buat Sayang ❤️
    </p>

    <p class="note">
      semoga semua hal baik selalu datang ke kamu,
      dan semoga aku masih boleh ikut ada sesuatu buat kamu.
      ngga seberapa sii, tapi aku bikinnya khusus buat kamu.
    </p>

    <p class="note">
      <b>Jangan langsung pergi yaa, coba buka dulu 👀❤️</b>
    </p>

    <button onclick="openGift()">
      Buka sekarang ❤️
    </button>

  </main>


  <!-- BAGIAN VIDEO -->
  <section id="video">

    <p class="video-text">
      <b>ini buat kamu ❤️</b>
    </p>

    <video controls>
      <source
        src="copy_920CD2C6-8A93-46C2-9D0C-8E420ACFF68F.mp4"
        type="video/mp4"
      >
      Browser kamu tidak mendukung video.
    </video>

  </section>


  <script>

    function openGift() {

      const video = document.getElementById("video");

      video.classList.add("show");

      setTimeout(() => {
        video.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }, 100);

    }

  </script>

</body>
</html>
