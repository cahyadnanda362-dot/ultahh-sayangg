<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Sayangg ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Georgia,"Times New Roman",serif;
    background:linear-gradient(135deg,#fff1f5,#ffe4ec,#fff8fa);
    color:#5b3440;
}

.card{
    width:min(92%,540px);
    padding:42px 28px;
    text-align:center;
    background:rgba(255,255,255,.9);
    border-radius:28px;
    box-shadow:0 18px 60px rgba(120,60,80,.18);
}

.small{
    font-family:Arial,sans-serif;
    letter-spacing:3px;
    font-size:12px;
    text-transform:uppercase;
    opacity:.65;
}

h1{
    font-size:39px;
    line-height:1.2;
    margin:12px 0 22px;
    color:#8d3f59;
}

.message{
    font-family:Arial,sans-serif;
    font-size:15px;
    line-height:1.85;
    text-align:left;
}

.note{
    font-family:"Brush Script MT",cursive;
    font-size:24px;
    text-align:center;
    margin:10px 0 22px;
}

button{
    border:0;
    padding:14px 27px;
    border-radius:999px;
    cursor:pointer;
    background:#a94f6c;
    color:white;
    font-size:15px;
    box-shadow:0 8px 22px rgba(169,79,108,.25);
    margin-top:8px;
}

#video{
    margin-top:24px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transform:translateY(100px);
    transition:max-height 1.5s ease, opacity 1.5s ease, transform 1.5s ease;
}

#video.show{
    max-height:1000px;
    opacity:1;
    transform:translateY(0);
}

#video video{
    width:100%;
    display:block;
    border-radius:16px;
}

</style>
</head>


<script>
function openGift() {
  const card = document.querySelector(".card");
  const videoSection = document.getElementById("video");

  // Hilangkan isi awal
  card.style.display = "none";

  // Munculkan video langsung
  videoSection.style.display = "block";
}
</script>
